<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><rect width="1440" height="850" fill="#101112"/><style>text{font-family:'Noto Sans CJK JP','Noto Sans',sans-serif;fill:#f2f2f2} .muted{fill:#a8adb1} .small{font-size:16px} .tiny{font-size:13px} .h{font-size:25px;font-weight:700} .item{font-size:18px} .label{font-size:13px;fill:#96a09b} .bold{font-weight:700}</style><rect width="1440" height="44" fill="#282a2c"/><text x="20" y="29" font-size="16">Ateliers AI Assistant　/　UI 構成参考（実装画面ではありません）</text><rect x="0" y="44" width="228" height="806" fill="#151718"/><text x="22" y="87" font-size="19" font-weight="700">Ateliers AI Assistant</text><text x="20" y="133" class="label">機能</text><rect x="9" y="150" width="208" height="44" rx="8" fill="#26342d"/><rect x="9" y="150" width="4" height="44" fill="#4bb879"/><text x="26" y="178" class="item">通知・情報収集</text><text x="26" y="227" class="item">AI チャット</text><line x1="18" y1="252" x2="210" y2="252" stroke="#373a3b"/><text x="20" y="283" class="label">システム・管理</text><text x="26" y="325" class="item">モデル管理</text><text x="26" y="373" class="item">ログ</text><text x="26" y="421" class="item">設定</text><line x1="18" y1="773" x2="210" y2="773" stroke="#373a3b"/><circle cx="28" cy="804" r="6" fill="#46bb77"/><text x="43" y="810" class="small">Worker 稼働中</text><text x="170" y="836" class="tiny muted">Debug</text><text x="265" y="97" class="h">設定</text><text x="265" y="127" class="small muted">Worker・AI・保存先をカテゴリ別に管理します</text><text x="265" y="166" class="label">カテゴリ別に整理し、設定の保存・再読込・注意文は維持</text><rect x="265" y="190" width="760" height="158" rx="12" fill="#1e2021"/><text x="289" y="228" class="bold item">バックグラウンド Worker</text><text x="289" y="262" class="small muted">接続済み　・　稼働中　・　サインイン時自動起動</text><rect x="289" y="287" width="108" height="38" rx="7" fill="#284b35"/><text x="307" y="312" class="small">Worker 起動</text><rect x="412" y="287" width="108" height="38" rx="7" fill="#343638"/><text x="430" y="312" class="small">Worker 停止</text><rect x="265" y="366" width="760" height="206" rx="12" fill="#1e2021"/><text x="289" y="404" class="bold item">バックグラウンド AI</text><text x="289" y="438" class="small muted">要約モデル　[ 選択してください　　　　　　　　　⌄ ]</text><rect x="290" y="455" width="18" height="18" rx="4" stroke="#92989a" fill="none"/><text x="324" y="471" class="small">AI 処理を一時停止</text><rect x="290" y="488" width="18" height="18" rx="4" stroke="#92989a" fill="none"/><text x="324" y="504" class="small">モデルの自動ロードを許可（初期 OFF）</text><rect x="290" y="521" width="18" height="18" rx="4" stroke="#92989a" fill="none"/><text x="324" y="537" class="small">モデルの自動アンロードを許可（初期 OFF）</text><rect x="265" y="590" width="760" height="220" rx="12" fill="#1e2021"/><text x="289" y="628" class="bold item">データと保存先</text><text x="289" y="661" class="small muted">環境：Debug　　保存先は変更できません</text><text x="289" y="698" class="small">設定（Roaming）　C:\...\Ateliers-Dev\Ai-Assistant.Debug</text><text x="289" y="732" class="small">アプリデータ（Local）　C:\...\Ateliers-Dev\Ai-Assistant.Debug</text><text x="289" y="766" class="small muted">フォルダーを開く / パスをコピー</text><rect x="1060" y="190" width="344" height="196" rx="12" fill="#252a27"/><text x="1084" y="231" class="bold item">画面設計のポイント</text><text x="1084" y="269" class="small">・カテゴリで探しやすくする</text><text x="1084" y="302" class="small">・説明は該当設定の近くに</text><text x="1084" y="335" class="small">・フォーム幅を制限する</text></svg>